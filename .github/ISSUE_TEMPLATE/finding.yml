name: Finding
description: A defect or risk found in the system under test (Twenty or the environment)
labels: ["finding"]
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One sentence, what is wrong and where.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical - data loss, data exposed to the wrong user or a permission bypass
        - Major - wrong behaviour with a workaround
        - Minor - cosmetic or edge case
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Twenty version and image digest, browser if relevant.
      placeholder: Twenty 2.48.0 (twentycrm/twenty@sha256:43fab4bf…), Chromium
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Request and response, logs, screenshots or a link to the failing test.

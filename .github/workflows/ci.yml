name: CI

# Always triggered, so the required "CI passed" check reports on every pull request;
# the jobs themselves are skipped when only documentation changed.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes the running workflow obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!**/*.md"
              - "!docs/**"
              - "!LICENSE"

  lint:
    name: Lint and type-check
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check

  test:
    name: Tests against Twenty
    needs: lint
    if: ${{ needs.lint.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Generates the throwaway secrets into .env and waits for the health checks.
      - name: Start Twenty and Mailpit
        run: ./scripts/start.sh

      - run: npm ci

      # Browsers are installed, not cached: Playwright's docs advise against caching
      # them, and restoring them takes about as long as downloading them.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Pull requests run the UI in Chromium only; Firefox and WebKit join in the
      # nightly workflow (nightly.yml).
      - name: Run tests
        run: npx playwright test --project=unit --project=api --project=chromium

      - name: Upload the HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-results
          path: allure-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Collect container logs
        if: ${{ failure() }}
        run: docker compose logs --no-color --timestamps > compose.log

      - name: Upload container logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-logs
          path: compose.log
          retention-days: 14

  # Runs on main only (a push or a manual run), and for failing runs too: that is
  # when the report matters most. See report.yml, shared with the nightly run.
  report:
    name: Allure report
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'skipped' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/report.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  # The single check required on main: fails if any job failed or was cancelled,
  # passes when the test jobs ran green or were skipped for a docs-only change.
  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [changes, lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the results of the other jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::A required job ended with: $result"
              exit 1
            fi
          done

name: twenty-qa

# Twenty CRM with its worker, Postgres and Redis, plus Mailpit to catch every email.
# Images are pinned by digest so every run tests exactly the same build.

# Settings shared by the server and the worker. The image is repeated in both services
# rather than kept here, so Dependabot finds it and bumps both together.
x-twenty: &twenty
  volumes:
    - server-local-data:/app/packages/twenty-server/.local-storage
  environment: &twenty-env
    PG_DATABASE_URL: postgres://postgres:postgres@db:5432/default
    REDIS_URL: redis://redis:6379
    SERVER_URL: http://localhost:3000
    STORAGE_TYPE: local
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?run scripts/start.sh or set ENCRYPTION_KEY}
    EMAIL_DRIVER: smtp
    EMAIL_SMTP_HOST: mailpit
    EMAIL_SMTP_PORT: 1025
    EMAIL_SMTP_NO_TLS: "true"
    EMAIL_FROM_ADDRESS: crm@example.com
    EMAIL_FROM_NAME: Twenty QA
    # Several workspaces, each on its own subdomain (qa.localhost:3000), as on Twenty's
    # cloud; anyone may create one, so tests can set up a second tenant (ADR 0001).
    IS_MULTIWORKSPACE_ENABLED: "true"
    IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS: "false"
    # Test environment: the whole suite runs from one workspace and invites many users,
    # so these limits are raised. Defaults in comments; see "Test environment" in the README.
    API_RATE_LIMITING_SHORT_LIMIT: 1000 # 100 per second
    API_RATE_LIMITING_LONG_LIMIT: 100000 # 100 per minute, shared by all API keys of a workspace
    INVITATION_SENDING_BY_EMAIL_THROTTLE_LIMIT: 1000 # 10 per address per week
    INVITATION_SENDING_BY_WORKSPACE_THROTTLE_LIMIT: 100000 # 500 per workspace per week
    EMAIL_SEND_WORKSPACE_DAILY_LIMIT: 100000 # 1,000 per workspace per day

services:
  server:
    <<: *twenty
    image: twentycrm/twenty:v2.50.1@sha256:6398458f42b760312aa59c4ade78cbaaa62063a0817e42cb21c66628fc310b3f
    ports:
      - "3000:3000"
    environment:
      <<: *twenty-env
      NODE_PORT: 3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # /healthz answers before the API can serve requests, so ask the GraphQL API
    # something that needs the database instead.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://localhost:3000/metadata -H 'Content-Type: application/json'
          -d '{"query":"{ checkUserExists(email: \"ready@example.com\") { exists } }"}'
          | grep -q '"exists"'
      interval: 5s
      timeout: 5s
      retries: 60

  worker:
    <<: *twenty
    image: twentycrm/twenty:v2.50.1@sha256:6398458f42b760312aa59c4ade78cbaaa62063a0817e42cb21c66628fc310b3f
    command: ["yarn", "worker:prod"]
    environment:
      <<: *twenty-env
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    depends_on:
      server:
        condition: service_healthy
    # Emails and webhooks are sent by the worker. It is ready once its BullMQ worker for
    # the email queue is connected to Redis (connection name bull:<base64 "email-queue">).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const s = require('net').connect(6379, 'redis', () => s.write('CLIENT LIST\r\n'));
          let out = '';
          s.on('data', (chunk) => { out += chunk; if (out.includes('name=bull:ZW1haWwtcXVldWU=')) process.exit(0); });
          s.on('error', () => process.exit(1));
          setTimeout(() => process.exit(1), 3000);
      interval: 5s
      timeout: 5s
      retries: 30

  db:
    image: postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: default
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: pg_isready -U postgres -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.2@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    ports:
      - "8026:8025"

volumes:
  db-data:
  server-local-data:
